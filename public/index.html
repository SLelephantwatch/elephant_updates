<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sri Lanka Elephant News</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5d6b80;
      --page: #eef2f6;
      --card: #ffffff;
      --line: #e2e8f0;
      --green: #0f6b4c;
      --header: #10243a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--page);
      line-height: 1.5;
    }

    header {
      background: var(--header);
      color: #f8fafc;
      padding: 1.75rem 1.5rem 1.5rem;
    }

    .wrap,
    main {
      max-width: 880px;
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 0.35rem;
      color: #8ee0c2;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    header p:last-child {
      margin: 0.4rem 0 0;
      color: #c5d0de;
    }

    main { padding: 1.5rem 1.5rem 3rem; }

    .status {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .feed { display: grid; gap: 1rem; }

    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.25rem 1.35rem 1.35rem;
      box-shadow: 0 8px 24px rgba(16, 36, 58, 0.05);
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    time {
      color: var(--muted);
      font-size: 0.85rem;
    }

    article h2 {
      margin: 0 0 0.65rem;
      font-size: 1.35rem;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    article img {
      display: block;
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 12px;
      margin: 0 0 0.9rem;
      background: #e8eef0;
    }

    article p {
      margin: 0 0 1rem;
      color: #314156;
    }

    .read {
      display: inline-block;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 650;
    }

    .read:hover { background: #0c5840; }

    .empty {
      padding: 1.5rem;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: var(--card);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">News dashboard</p>
      <h1>Sri Lanka Elephant News</h1>
      <p>Latest reports, refreshed every 60 seconds.</p>
    </div>
  </header>
  <main>
    <p class="status" id="status">Loading news…</p>
    <div class="feed" id="feed"></div>
  </main>
  <script>
    const feed = document.getElementById("feed");
    const status = document.getElementById("status");
    const badgeColors = ["#0f6b4c", "#0f4c81", "#8a3b12", "#6b2d5b", "#1d4e4a", "#7a2e2e", "#3f4c1d"];

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function safeUrl(value) {
      try {
        const parsed = new URL(value, window.location.origin);
        if (parsed.protocol === "http:" || parsed.protocol === "https:") return parsed.href;
      } catch (error) {
        return "";
      }
      return "";
    }

    function formatTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString();
    }

    function badgeColor(source) {
      let hash = 0;
      for (let index = 0; index < source.length; index += 1) {
        hash = (hash + source.charCodeAt(index)) % badgeColors.length;
      }
      return badgeColors[hash];
    }

    function render(posts) {
      if (!posts.length) {
        feed.innerHTML = '<p class="empty">No posts yet. New items appear here after they arrive at the webhook.</p>';
        status.textContent = "No posts yet. Checked " + new Date().toLocaleTimeString() + ".";
        return;
      }

      feed.innerHTML = posts.map((post) => {
        const image = safeUrl(post.image);
        const link = safeUrl(post.url);
        const when = formatTime(post.receivedAt);
        const source = String(post.source || "").trim();
        return (
          "<article>" +
            '<div class="meta">' +
              (source ? '<span class="badge" style="background:' + badgeColor(source) + '">' + escapeHtml(source) + "</span>" : "") +
              (when ? "<time>" + escapeHtml(when) + "</time>" : "") +
            "</div>" +
            (image ? '<img src="' + escapeHtml(image) + '" alt="">' : "") +
            "<h2>" + escapeHtml(post.title || "Untitled post") + "</h2>" +
            (post.text ? "<p>" + escapeHtml(post.text) + "</p>" : "") +
            (link ? '<a class="read" href="' + escapeHtml(link) + '" target="_blank" rel="noopener noreferrer">Read Full Article →</a>' : "") +
          "</article>"
        );
      }).join("");

      status.textContent = posts.length + (posts.length === 1 ? " story. " : " stories. ") + "Updated " + new Date().toLocaleTimeString() + ".";
    }

    async function loadNews() {
      try {
        const response = await fetch("/api/news", { cache: "no-store" });
        if (!response.ok) throw new Error("News request failed");
        const posts = await response.json();
        render(Array.isArray(posts) ? posts : []);
      } catch (error) {
        status.textContent = "Could not load the news feed. Trying again in 60 seconds.";
      }
    }

    loadNews();
    setInterval(loadNews, 60000);
  </script>
</body>
</html>
